<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>快递计算器 · 重量 / 体积</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>快递计算器</h1>
    <p class="subtitle">对比「实际重量」与「体积重量」，取较大者作为计费重量</p>

    <div class="field">
      <label for="weight">实际重量 <span class="hint">(千克 kg)</span></label>
      <input id="weight" type="number" min="0" step="any" placeholder="例如 5" inputmode="decimal" />
    </div>

    <div class="field">
      <label>包裹尺寸 <span class="hint">(厘米 cm)</span></label>
      <div class="dims">
        <input id="length" type="number" min="0" step="any" placeholder="长" inputmode="decimal" />
        <input id="width" type="number" min="0" step="any" placeholder="宽" inputmode="decimal" />
        <input id="height" type="number" min="0" step="any" placeholder="高" inputmode="decimal" />
      </div>
    </div>

    <div class="divisor-row">
      <span>体积重量除数：长×宽×高 ÷</span>
      <input id="divisor" type="number" min="1" step="any" value="9000" inputmode="decimal" />
    </div>

    <button id="calcBtn">计算计费重量</button>

    <div id="result" class="result"></div>
  </div>

  <script src="calculator.js"></script>
</body>
</html>
